<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gece Topukları: Şehir Devriyesi</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <canvas id="gameCanvas" width="1200" height="720" aria-label="Şehir devriyesi oyunu"></canvas>

      <div class="mobile-controls" aria-label="Dokunmatik oyun kontrolleri">
        <div class="direction-pad" aria-label="Hareket kontrolleri">
          <button class="control-button direction-button up-button" type="button" data-key="arrowup" aria-label="Yukarı git">▲</button>
          <button class="control-button direction-button left-button" type="button" data-key="arrowleft" aria-label="Sola git">◀</button>
          <button class="control-button direction-button right-button" type="button" data-key="arrowright" aria-label="Sağa git">▶</button>
          <button class="control-button direction-button down-button" type="button" data-key="arrowdown" aria-label="Aşağı git">▼</button>
        </div>
        <button id="interactBtn" class="control-button interact-button" type="button" aria-label="Etkileşim kur">Etkileşim</button>
      </div>

      <div class="hud">
        <div class="top-bar">
          <div class="pill">
            <span class="label">Polis</span>
            <strong id="officerName">Ari Park</strong>
          </div>
          <div class="pill">
            <span class="label">Görev</span>
            <strong id="missionText">Şehirde devriye gez</strong>
          </div>
          <div class="pill money-pill">
            <span class="label">Para</span>
            <strong id="moneyText">∞</strong>
          </div>
        </div>

        <div class="status-grid">
          <div class="meter-wrap">
            <div class="meter-label-row">
              <span>Topuk Sağlamlığı</span>
              <span id="heelValue">100%</span>
            </div>
            <div class="meter">
              <div id="heelBar" class="meter-fill heel-fill"></div>
            </div>
          </div>

          <div class="meter-wrap">
            <div class="meter-label-row">
              <span>Enerji</span>
              <span id="energyValue">100%</span>
            </div>
            <div class="meter">
              <div id="energyBar" class="meter-fill energy-fill"></div>
            </div>
          </div>
        </div>

        <div class="mission-log" id="missionLog">
          <div class="log-title">Merkez</div>
          <p>Şehir merkezinde hareketlilik var. Topuklarını sağlam tut, şehri güvende tut.</p>
        </div>
      </div>

      <div id="messageBox" class="message-box hidden"></div>
      <button id="restartBtn" class="restart hidden" type="button">Vardiyayı Yeniden Başlat</button>
    </div>

    <script src="game.js"></script>
  </body>
</html>
